<section class="h-100 back">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-8 col-xl-6">
        <div class="card rounded-3">
          <img src="Register.JPG" class="w-100" style="border-top-left-radius: .3rem; border-top-right-radius: .3rem;"
            alt="Sample photo">
          <div class="card-body p-4 p-md-5">
            <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2">Registration Info</h3>

            <form class="px-md-2" [formGroup]="registerForm" (ngSubmit)="RegisterMember()">

              <!-- First Name -->
              <div class="form-outline mb-4">
                <label for="firstName">First Name <span class="text-danger">*</span></label>
                <input type="text" id="firstName" class="form-control" placeholder="Enter Your First Name"
                  formControlName="FirstName" />
                <small class="text-danger fst-italic"
                  *ngIf="registerForm.get('FirstName')?.invalid && registerForm.get('FirstName')?.touched">
                  First Name is required.
                </small>
              </div>

              <!-- Last Name -->
              <div class="form-outline mb-4">
                <label for="lastName">Last Name <span class="text-danger">*</span></label>
                <input type="text" id="lastName" class="form-control" placeholder="Enter Your Last Name"
                  formControlName="LastName" />
                <small class="text-danger fst-italic"
                  *ngIf="registerForm.get('LastName')?.invalid && registerForm.get('LastName')?.touched">
                  Last Name is required.
                </small>
              </div>

              <!-- Email -->
              <div class="form-outline mb-4">
                <label for="email">Email Address <span class="text-danger">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="Enter Your Valid Email"
                  formControlName="Email" />
                <div class="text-success fst-italic fw-bold">
                  Please enter a valid email to receive notifications.
                </div>
                <small class="text-danger fst-italic"
                  *ngIf="registerForm.get('Email')?.invalid && registerForm.get('Email')?.touched">
                  A valid email is required.
                </small>
              </div>

              <!-- Mobile Number -->
              <div class="form-outline mb-4">
                <label for="mobileNumber">Mobile Number <span class="text-danger">*</span></label>
                <input type="text" id="mobileNumber" class="form-control" placeholder="Eg: 0771234567"
                  formControlName="MobileNumber" />
                <small class="text-danger fst-italic"
                  *ngIf="registerForm.get('MobileNumber')?.invalid && registerForm.get('MobileNumber')?.touched">
                  Enter a valid mobile number.
                </small>
              </div>

              <!-- NIC -->
              <div class="form-outline mb-4">
                <label for="nic">NIC Number <span class="text-danger">*</span></label>
                <input type="text" id="nic" class="form-control" placeholder="Eg: 982760884V or 199827600884"
                  formControlName="NIC" />
                <small class="text-danger fst-italic"
                  *ngIf="registerForm.get('NIC')?.invalid && registerForm.get('NIC')?.touched">
                  Enter a valid NIC number.
                </small>
              </div>

              <!-- License Number -->
              <div class="form-outline mb-4">
                <label for="licenseNumber">License Number <span class="text-danger">*</span></label>
                <input type="text" id="licenseNumber" class="form-control" placeholder="Eg: B4647245"
                  formControlName="LicenseNumber" />
                <small class="text-danger fst-italic"
                  *ngIf="registerForm.get('LicenseNumber')?.invalid && registerForm.get('LicenseNumber')?.touched">
                  Enter a valid license number.
                </small>
              </div>

              <!-- License Image -->
              <div class="form-outline mb-4">
                <label for="licenseImage">Upload Your License Photo <span class="text-danger">*</span></label>
                <input type="file" id="licenseImage" class="form-control"
                  (change)="onFileChange($event, 'LicenseImage')" />
                <small class="text-danger fst-italic"
                  *ngIf="registerForm.get('LicenseImage')?.invalid && registerForm.get('LicenseImage')?.touched">
                  License image is required.
                </small>
              </div>

              <!-- Camera Capture -->
              <div class="form-outline mb-4">
                <label for="cameraCapture">Upload Camera Photo <span class="text-danger">*</span></label>
                <div>
                  <button id="openCamera" type="button" class="btn btn-success me-2" (click)="openCamera()">Open
                    Camera</button>
                  <button id="takePhoto" class="btn btn-secondary me-2" (click)="takePhoto()"
                    [disabled]="!isCameraOpen">Take Photo</button>
                  <!-- <button id="closeCamera" class="btn btn-danger me-2" (click)="closeCamera()"
                    [disabled]="!isCameraOpen">Close Camera</button> -->
                </div>
                <video *ngIf="isCameraOpen" id="video" #videoElement></video>
                <canvas id="canvas" #canvasElement style="display: none;"></canvas>
                <img  id="capturedImage" #capturedImageElement  />

                <small class="text-danger fst-italic"
                  *ngIf="registerForm.get('CameraCapture')?.invalid && registerForm.get('CameraCapture')?.touched">
                  Camera capture is required.
                </small>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary btn-lg mb-1" [disabled]="registerForm.invalid">
                Register
              </button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
